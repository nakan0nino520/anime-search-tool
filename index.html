<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AnimeFinder</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="light-mode">

<!-- Navbar -->
<nav id="navbar">
 <h1>AnimeFinder</h1>
 <button id="toggle-liquid-glass" class="switch"></button>
</nav>

<!-- API Assistant -->
<section id="api-assistant"></section>

<!-- Main Content -->
<main id="main-content">
 <form id="search-form">
 <input type="file" accept="image/*" capture="environment" />
 <button type="submit">Search</button>
 </form>

 <div id="results"></div>
</main>

<!-- Footer Navigation -->
<footer id="footer-nav">
 <a href="#home">Home</a>
 <a href="#history">History</a>
 <a href="#settings">Settings</a>
</footer>

<!-- Modals -->
<div id="modal-settings"></div>
<div id="modal-diary"></div>

<script src="js/i18n.js"></script>
<script src="js/personalization.js"></script>
<script src="js/apiHandler.js"></script>
<script src="js/app.js"></script>
</body>
</html>
